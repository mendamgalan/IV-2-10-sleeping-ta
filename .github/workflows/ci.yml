name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install build and GUI test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-tk xvfb xauth
      - name: Build with warnings as errors
        run: make -C sleeping-ta
      - name: Engine and UI tests
        run: xvfb-run -a make -C sleeping-ta test
      - name: Python syntax
        run: python3 -m compileall -q sleeping-ta/src sleeping-ta/tests
